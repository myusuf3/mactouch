name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
        working-directory: app
      - run: swift test
        working-directory: app

  pam:
    name: PAM module build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C pam all test

  vectors:
    name: Protocol vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gen-vectors.py --check
